apply plugin: 'com.android.application'

/**
 * Release signing.
 *
 * Supply a keystore either through android/keystore.properties (git-ignored) or
 * through the environment, which is what a CI runner should use:
 *
 *   QUANTUM_KEYSTORE_FILE, QUANTUM_KEYSTORE_PASSWORD,
 *   QUANTUM_KEY_ALIAS, QUANTUM_KEY_PASSWORD
 *
 * Without one the release build falls back to the debug certificate and says so
 * loudly. That fallback used to be silent and unconditional, which produced an
 * "app-release.apk" carrying the "Android Debug" identity -- rejected by Play,
 * and an identity anyone can reproduce, so any third party could build an APK
 * the device would accept as an update.
 */
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def ks = { String prop, String env ->
    keystoreProps.getProperty(prop) ?: System.getenv(env)
}

def releaseStoreFile = ks('storeFile', 'QUANTUM_KEYSTORE_FILE')
def releaseStorePassword = ks('storePassword', 'QUANTUM_KEYSTORE_PASSWORD')
def releaseKeyAlias = ks('keyAlias', 'QUANTUM_KEY_ALIAS')
def releaseKeyPassword = ks('keyPassword', 'QUANTUM_KEY_PASSWORD')

def hasReleaseSigning = releaseStoreFile != null && !releaseStoreFile.isEmpty() &&
        file(releaseStoreFile).exists() && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

android {
    namespace "com.quantum.iptv"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.quantum.iptv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "2.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Still produces an installable APK for sideloading and testing,
                // but it is not a distributable build and must not be presented
                // as one.
                signingConfig signingConfigs.debug
            }
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

if (!hasReleaseSigning) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
            logger.warn("")
            logger.warn("*********************************************************************")
            logger.warn("  No release keystore configured -- signing with the DEBUG key.")
            logger.warn("  This APK cannot be published and must not be distributed.")
            logger.warn("  Set QUANTUM_KEYSTORE_FILE / _PASSWORD / QUANTUM_KEY_ALIAS /")
            logger.warn("  QUANTUM_KEY_PASSWORD, or create android/keystore.properties.")
            logger.warn("*********************************************************************")
            logger.warn("")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // MKV/Matroska demuxing for on-demand content the WebView's <video> element
    // cannot decode -- see NativePlayerActivity.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
